name: QEMU Boot Test
on:
  workflow_dispatch:
  push:
    branches: [test1]
    paths:
      - '6.18.52-VXTux-UMS512/arch/arm64/boot/dts/sprd/qemu-ums512-t1030.dts'
      - '6.18.52-VXTux-UMS512/arch/arm64/boot/dts/sprd/Makefile'
      - '6.18.52-VXTux-UMS512/arch/arm64/configs/vxtux_618_qemu.defconfig'
      - '.github/workflows/qemu-boot.yml'
jobs:
  boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev qemu-system-arm busybox-static cpio

      # Pola config sama dengan v17-build: .config device + enhanced_config.cfg,
      # ditambah fragmen khusus QEMU (vxtux_618_qemu.defconfig: dummy_hcd, i2c-sprd,
      # virtio-console). Ketiga file disimpan CRLF — wajib LF sebelum merge.
      - name: Config (device + enhanced + fragmen QEMU)
        run: |
          cd 6.18.52-VXTux-UMS512
          find scripts/ -type f -exec chmod +x {} +
          cp .config .config.device
          sed -i 's/\r$//' .config.device ../enhanced_config.cfg arch/arm64/configs/vxtux_618_qemu.defconfig
          scripts/kconfig/merge_config.sh -m -O . .config.device \
            ../enhanced_config.cfg arch/arm64/configs/vxtux_618_qemu.defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # Guard: simbol konsol QEMU harus selamat setelah olddefconfig.
          # PL011 sengaja tidak dicek — driver AMBA memang tidak ada di tree V17
          # (docs/CI-KNOWN-DROPPED.txt); console memakai virtio-console (hvc0).
          rc=0
          for s in CONFIG_VIRTIO=y CONFIG_VIRTIO_PCI=y CONFIG_VIRTIO_CONSOLE=y \
                   CONFIG_BLK_DEV_INITRD=y CONFIG_RD_GZIP=y CONFIG_BINFMT_SCRIPT=y \
                   CONFIG_DEVTMPFS=y CONFIG_ARCH_SPRD=y CONFIG_ARM_GIC_V3=y \
                   CONFIG_DRM_VIRTIO_GPU=y CONFIG_FRAMEBUFFER_CONSOLE=y \
                   CONFIG_DRM_FBDEV_EMULATION=y CONFIG_VT_CONSOLE=y; do
            if ! grep -qx "$s" .config; then
              echo "::error::HILANG setelah olddefconfig: $s"
              rc=1
            fi
          done
          exit $rc

      # DTB dibangun PERTAMA: kesalahan sintaks DTS ketahuan dalam ~3 menit,
      # jadi iterasi perbaikan DTS tidak menunggu build Image 25 menit.
      - name: Build DTB QEMU (gagal cepat)
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sprd/qemu-ums512-t1030.dtb -j$(nproc)
          ls -l arch/arm64/boot/dts/sprd/qemu-ums512-t1030.dtb

      - name: Build Image
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          ls -l arch/arm64/boot/Image

      # Init C statis arm64, tanpa busybox sama sekali. Dua kegagalan
      # busybox tercatat: (1) run 40090028825 memakai /bin/busybox milik
      # runner yang x86-64 -> kernel gagal exec (ENOEXEC, exitcode 5) lalu
      # "No working init found"; (2) run 40094005980 memakai
      # busybox-static:arm64 hasil unduhan ports -> tamu melempar undefined
      # instruction (el0_undef, exitcode 0x4) — binari Ubuntu mengandung
      # instruksi di atas baseline -cpu cortex-a72. Init ini dikompilasi
      # -march=armv8-a eksplisit: mount proc/sys/dev, tulis marker
      # "VXTUX-QEMU-BOOT-OK" ke console+kmsg, lalu poweroff.
      - name: Initramfs (init C statis arm64)
        run: |
          set -e
          mkdir -p /tmp/src
          cat > /tmp/src/init.c <<'EOFC'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/reboot.h>
          #include <string.h>
          #include <sys/mount.h>
          #include <unistd.h>
          static void out(const char *s)
          {
            int fd;
            write(1, s, strlen(s));
            fd = open("/dev/console", O_WRONLY | O_NOCTTY);
            if (fd >= 0) { write(fd, s, strlen(s)); close(fd); }
            fd = open("/dev/kmsg", O_WRONLY);
            if (fd >= 0) { write(fd, s, strlen(s)); close(fd); }
          }
          /* Banner CLI ke /dev/tty1 (VT) — inilah yang dirender fbcon ke
           * framebuffer virtio-gpu pada boot fbcon, hasil dicapture lewat
           * screendump QEMU menjadi fbcon.png. Bila fbcon tidak ada,
           * tulisan tetap masuk buffer VT tapi tak pernah dirender. */
          static void tty1_banner(void)
          {
            char msg[80];
            int fd = open("/dev/tty1", O_WRONLY | O_NOCTTY);
            if (fd < 0) {
              snprintf(msg, sizeof msg, "=== tty1 GAGAL: errno=%d ===\n", errno);
              out(msg);
              return;
            }
            const char *cli =
              "\033[2J\033[H"
              "VXTux 6.18.52 - fbcon CLI test\r\n"
              "===========================================\r\n"
              "[ OK ] framebuffer console menampilkan teks\r\n"
              "===========================================\r\n"
              "> ";
            int n = write(fd, cli, strlen(cli));
            close(fd);
            snprintf(msg, sizeof msg, "=== tty1: %d byte CLI tertulis ===\n", n);
            out(msg);
          }
          int main(void)
          {
            mount("none", "/proc", "proc", 0, 0);
            mount("none", "/sys", "sysfs", 0, 0);
            mount("none", "/dev", "devtmpfs", 0, 0);
            out("=== VXTUX INIT BERJALAN (init C statis arm64) ===\n");
            tty1_banner();
            out("=== VXTUX-QEMU-BOOT-OK ===\n");
            /* Jendela 8 detik sebelum poweroff: QEMU boot fbcon perlu
             * waktu menjalankan HMP screendump (fbcon.ppm) sebelum tamu
             * mati — tanpa ini screendump selalu Connection refused. */
            sleep(8);
            sync();
            reboot(RB_POWER_OFF);
            for (;;) sleep(1);
          }
          EOFC
          aarch64-linux-gnu-gcc -static -O2 -march=armv8-a -mabi=lp64 \
            -o /tmp/init /tmp/src/init.c
          file /tmp/init | tee /tmp/init-arch.txt
          file /tmp/init | grep -q 'ARM aarch64' || \
            { echo "::error::init bukan aarch64: $(file /tmp/init)"; exit 1; }

          rm -rf /tmp/initramfs
          mkdir -p /tmp/initramfs/bin /tmp/initramfs/proc /tmp/initramfs/sys /tmp/initramfs/dev
          cp /tmp/init /tmp/initramfs/init
          chmod 755 /tmp/initramfs/init
          (cd /tmp/initramfs && find . | cpio -o -H newc --owner root:root | gzip -9) > /tmp/initramfs.cpio.gz
          ls -lh /tmp/initramfs.cpio.gz
          gzip -t /tmp/initramfs.cpio.gz
          # Diagnostik, non-fatal: format daftar `cpio -t` tidak konsisten
          # antar versi (gerbang `grep -qx './init'` gagal padahal arsip 647 KB
          # = ukuran binary init memang berisi /init). Penentu sebenarnya
          # adalah gate boot: init hilang -> panic "No working init found"
          # yang terbaca jelas di log serial.
          gzip -dc /tmp/initramfs.cpio.gz | cpio -t > /tmp/cpio-list.txt || true
          echo '--- isi initramfs (cpio -t) ---'
          cat /tmp/cpio-list.txt || true
          grep -qE '(^|\./)init$' /tmp/cpio-list.txt || \
            echo '::warning::cpio -t tak menampilkan entri init — biarkan gate boot menentukan'

      # Bisect dua boot dalam satu run (run 40087667380: tamu menggantung420s,
      # serial 0 byte — entah DTB kustom atau kernelnya yang belum pernah boot).
      #   Boot A = DTB stok -M virt  → memisahkan masalah kernel vs DTB kustom
      #   Boot B = DTB kustom qemu-ums512-t1030
      # -d guest_errors,unimp,cpu_reset memberi jejak QEMU bila tamu menyentuh
      # perangkat yang tidak ada. Gate tetap marker VXTUX-QEMU-BOOT-OK.
      - name: Boot QEMU — bisect DTB stok vs DTB kustom
        run: |
          set +e
          boot() {
            tag=$1; shift
            timeout --signal=KILL 240 qemu-system-aarch64 \
              -machine virt,gic-version=3,highmem=off \
              -cpu cortex-a72 -smp 8 -m 2G \
              -kernel 6.18.52-VXTux-UMS512/arch/arm64/boot/Image \
              -initrd /tmp/initramfs.cpio.gz \
              -append "console=hvc0 rdinit=/init panic=-1 oops=panic loglevel=8" \
              -device virtio-serial-pci \
              -device virtconsole,chardev=vc0 \
              -chardev stdio,id=vc0,signal=off,logfile=/tmp/serial-$tag.log \
              -display none -monitor none -no-reboot \
              -d guest_errors,unimp,cpu_reset -D /tmp/qemu-$tag.debug.log \
              "$@" > /tmp/qemu-$tag-stdout.log 2>&1
            echo "[$tag] qemu exit=$?"
            echo "[$tag] serial bytes: $(wc -c < /tmp/serial-$tag.log 2>/dev/null)"
            echo "[$tag] tail serial:"
            tail -n 25 /tmp/serial-$tag.log 2>/dev/null
            echo "[$tag] tail qemu stdout:"
            tail -n 8 /tmp/qemu-$tag-stdout.log 2>/dev/null
          }

          boot stock   # tanpa -dtb: DTB dibuat QEMU sendiri
          boot custom -dtb 6.18.52-VXTux-UMS512/arch/arm64/boot/dts/sprd/qemu-ums512-t1030.dtb

          # Boot C: fbcon/KMS — jawaban atas "apakah fbcon & DRM/KMS sudah
          # bisa print CLI?". virtio-gpu-pci dienumerasi lewat pcie+ITS yang
          # sudah ada di DTB kustom; VNC headless dipakai supaya QEMU punya
          # permukaan display untuk HMP screendump; monitor TCP menerima
          # perintah screendump ke /tmp/fbcon.ppm lalu diubah jadi PNG.
          # Gerbang: marker boot + piksel tak-hitam di framebuffer (teks
          # fbcon, bukan layar hitam kosong).
          tag=fb
          qemu-system-aarch64 \
            -machine virt,gic-version=3,highmem=off \
            -cpu cortex-a72 -smp 8 -m 2G \
            -kernel 6.18.52-VXTux-UMS512/arch/arm64/boot/Image \
            -initrd /tmp/initramfs.cpio.gz \
            -append "console=hvc0 rdinit=/init panic=-1 oops=panic loglevel=8" \
            -device virtio-serial-pci \
            -device virtconsole,chardev=vc0 \
            -device virtio-gpu-pci \
            -chardev stdio,id=vc0,signal=off,logfile=/tmp/serial-fb.log \
            -vnc 127.0.0.1:0 \
            -monitor tcp:127.0.0.1:55555,server,nowait \
            -no-reboot \
            -d guest_errors,unimp,cpu_reset -D /tmp/qemu-fb.debug.log \
            > /tmp/qemu-fb-stdout.log 2>&1 &
          qpid=$!
          ok_fb=0
          for i in $(seq 1 120); do
            if grep -q 'VXTUX-QEMU-BOOT-OK' /tmp/serial-fb.log 2>/dev/null; then ok_fb=1; break; fi
            kill -0 $qpid 2>/dev/null || break
            sleep 1
          done
          echo "[fb] marker=$ok_fb pid=$qpid"
          if [ "$ok_fb" = 1 ]; then
            # Retry: kirim screendump+quit via HMP/TCP selama QEMU masih
            # hidup (jendela 8 detik dari init sebelum poweroff).
            for try in 1 2 3 4; do
              kill -0 $qpid 2>/dev/null || { echo "[fb] QEMU keluar sebelum screendump"; break; }
              if timeout 8 bash -c 'exec 3<>/dev/tcp/127.0.0.1/55555; printf "screendump /tmp/fbcon.ppm\nquit\n" >&3; cat <&3'; then
                [ -f /tmp/fbcon.ppm ] && break
              fi
              sleep 1
            done
          else
            timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1:55555; printf "quit\n" >&3; cat <&3' || true
          fi
          wait $qpid; echo "[fb] qemu exit=$?"
          echo "[fb] serial bytes: $(wc -c < /tmp/serial-fb.log 2>/dev/null)"
          echo '--- jejak DRM/fbcon di serial fb ---'
          grep -nE 'fb0|fbcon|frame buffer|virtio_gpu|drm ' /tmp/serial-fb.log | head -20
          ls -l /tmp/fbcon.ppm 2>/dev/null
          fb_px=1
          if [ -f /tmp/fbcon.ppm ]; then
            command -v convert >/dev/null 2>&1 && convert /tmp/fbcon.ppm /tmp/fbcon.png && ls -l /tmp/fbcon.png
            python3 - <<'EOFPY'
          import sys
          f = open('/tmp/fbcon.ppm', 'rb')
          assert f.readline().strip() == b'P6', 'format PPM bukan P6'
          line = f.readline()
          while line.startswith(b'#'):
            line = f.readline()
          w, h = map(int, line.split())
          mx = int(f.readline())
          data = f.read(w * h * 3)
          nb = sum(1 for i in range(0, len(data), 3) if data[i:i+3] != b'\x00\x00\x00')
          pct = 100 * nb // (w * h)
          print('fbcon framebuffer: %dx%d, piksel tak-hitam=%d (%d%%)' % (w, h, nb, pct))
          sys.exit(0 if nb > 500 else 1)
          EOFPY
            if [ $? -eq 0 ]; then
              echo 'FBCON RENDER OK — framebuffer berisi teks, bukan hitam'
            else
              echo '::warning::framebuffer hitam/kosong — fbcon tidak merender (lihat jejak DRM di atas)'
              fb_px=0
            fi
          else
            echo '::warning::screendump tidak menghasilkan fbcon.ppm'
            fb_px=0
          fi

          ok_stock=0; ok_custom=0
          grep -q 'VXTUX-QEMU-BOOT-OK' /tmp/serial-stock.log && ok_stock=1
          grep -q 'VXTUX-QEMU-BOOT-OK' /tmp/serial-custom.log && ok_custom=1
          echo "marker: stock=$ok_stock custom=$ok_custom fb=$ok_fb px=$fb_px"

          if [ "$ok_custom" = 1 ]; then
            if grep -q 'Kernel panic' /tmp/serial-custom.log; then
              echo '::error::marker ada tapi Kernel panic tercatat di log kustom'
              exit 1
            fi
            echo 'BOOT OK — DTB kustom tembus userspace tanpa panic'
            if [ "$ok_fb" = 1 ] && [ "$fb_px" = 1 ]; then
              echo 'FBCON OK — DRM virtio-gpu + fbcon merender CLI (fbcon.png di artefak)'
              exit 0
            fi
            echo '::error::boot kustom OK tetapi uji fbcon gagal — lihat jejak DRM di log fb'
            exit 1
          fi
          if [ "$ok_stock" = 1 ]; then
            echo '::error::Kernel OK dengan DTB stok, tetapi DTB kustom gagal — perbaiki DTS'
            grep -nE 'Kernel panic|BUG:|Unable to handle kernel' /tmp/serial-custom.log | tail -n 10 || true
            exit 1
          fi
          echo '::error::Kedua boot menggantung tanpa output — masalah di kernel/Image/konsol, bukan DTS'
          echo '--- debug QEMU stock tail ---'; tail -n 25 /tmp/qemu-stock.debug.log 2>/dev/null
          echo '--- debug QEMU custom tail ---'; tail -n 25 /tmp/qemu-custom.debug.log 2>/dev/null
          exit 1

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial
          path: |
            /tmp/serial-stock.log
            /tmp/serial-custom.log
            /tmp/serial-fb.log
            /tmp/qemu-stock-stdout.log
            /tmp/qemu-custom-stdout.log
            /tmp/qemu-fb-stdout.log
            /tmp/qemu-stock.debug.log
            /tmp/qemu-custom.debug.log
            /tmp/qemu-fb.debug.log
            /tmp/fbcon.ppm
            /tmp/fbcon.png
          if-no-files-found: warn
