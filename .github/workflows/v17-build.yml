name: Build V17 VXTux Kernel
on:
  workflow_dispatch:
  push:
    branches: [main, test1, v17-build]
jobs:
  build-v17:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
      - name: Fix permissions
        run: |
          cd 6.18.52-VXTux-UMS512
          find scripts/ -type f -exec chmod +x {} +
          cp .config .config.device
          # Kedua file disimpan CRLF di repo; kconfig/merge_config lebih aman LF.
          sed -i 's/\r$//' .config.device ../enhanced_config.cfg
      # PENTING: fragmen di-MERGE di atas .config device, bukan menggantikannya.
      # Dulu `cp ../enhanced_config.cfg .config` membuang ~6000 baris config
      # device, sehingga build CI hanya menghasilkan 222 .ko sementara build
      # device sesungguhnya 1.424 .ko — verifikasi CI jadi tidak mewakili device.
      - name: Merge enhanced_config.cfg di atas .config device
        run: |
          cd 6.18.52-VXTux-UMS512
          scripts/kconfig/merge_config.sh -m -O . .config.device ../enhanced_config.cfg
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      # Guard: setiap simbol di fragmen harus SELAMAT setelah olddefconfig.
      # Simbol yang dependensinya kurang dibuang tanpa peringatan (kelas bug
      # SC27XX_TSENSOR_THERMAL) — lebih baik gagal cepat di sini daripada
      # menemukan .ko hilang di akhir build.
      - name: Guard — simbol fragmen yang memang ada di Kconfig harus selamat
        run: |
          cd 6.18.52-VXTux-UMS512
          # Fragmen ini mewarisi config vendor 5.4 utuh: ratusan entri menunjuk
          # driver yang belum di-port (SPRD_7SRESET, SPRD_IQ, ...) atau subsistem
          # yang memang dipangkas dari tree ini (VHOST, UNIX_SCM). Simbol yang
          # tidak didefinisikan Kconfig mana pun BUKAN bug config — itu pekerjaan
          # port, dan dilacak di docs/PORT-AUDIT.md.
          #
          # Yang dicek ketat: simbol yang Kconfig-nya ADA tapi tetap hilang setelah
          # olddefconfig. Itu berarti dependensinya kurang (kelas bug
          # SC27XX_TSENSOR_THERMAL), dan modulnya akan hilang tanpa suara.
          git ls-files '*Kconfig*' > /tmp/kconfigs.txt
          # Daftar simbol yang Kconfig-nya ada di tree ini (sekali, lalu dicari).
          xargs -a /tmp/kconfigs.txt grep -hE '^(menu)?config[[:space:]]+' \
            | awk '{print $2}' | sort -u > /tmp/kconfig_syms.txt
          echo "Kconfig mendefinisikan $(wc -l < /tmp/kconfig_syms.txt) simbol"
          rc=0; absent=0; coerce=0
          while IFS= read -r line; do
            line=${line%$'\r'}
            case "$line" in
              CONFIG_*=*) sym=${line%%=*}; val=${line#*=} ;;
              *) continue ;;
            esac
            grep -qx "$sym=$val" .config && continue
            got=$(grep -m1 "^$sym=" .config || true)
            name=${sym#CONFIG_}
            if ! grep -qx "$name" /tmp/kconfig_syms.txt; then
              absent=$((absent+1))
              continue
            fi
            if [ "$val" = m ] && [ "${got#*=}" = y ]; then
              # bool yang diminta =m: Kconfig menaikkan ke =y, bukan bug.
              coerce=$((coerce+1))
              continue
            fi
            [ -z "$got" ] && got="$sym is not set"
            echo "::error::DROPPED $sym=$val -> ${got#*=} (Kconfig ada, dependensi kurang)"
            rc=1
          done < ../enhanced_config.cfg
          echo "Simbol fragmen yang belum punya Kconfig di tree ini: $absent (bukan kegagalan guard)"
          echo "Simbol bool yang diminta =m lalu jadi =y: $coerce"
          exit $rc
      - name: Upload effective .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-config
          path: 6.18.52-VXTux-UMS512/.config
          if-no-files-found: warn
      - name: Build DTB (verifikasi DTS thermal/efuse chain)
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sprd/ums512-1h10-vxtux.dtb -j$(nproc)
          ls -l arch/arm64/boot/dts/sprd/ums512-1h10-vxtux.dtb
      - name: Build modules
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules -j$(nproc)
      - name: Tar .ko tree
        run: |
          cd 6.18.52-VXTux-UMS512
          find . -name '*.ko' | tar -czf /tmp/built_kos.tar.gz -T -
          ls -lh /tmp/built_kos.tar.gz
      - name: Upload .ko tarball
        uses: actions/upload-artifact@v4
        with:
          name: v17-built-kos
          path: /tmp/built_kos.tar.gz
          if-no-files-found: error
      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: v17-dtb
          path: 6.18.52-VXTux-UMS512/arch/arm64/boot/dts/sprd/ums512-1h10-vxtux.dtb
          if-no-files-found: error
